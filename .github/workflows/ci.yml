name: CI

on:
  push:
  pull_request:

# Cancel in-progress runs for the same ref when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & quality gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ideajar
          POSTGRES_PASSWORD: ideajar
          POSTGRES_DB: ideajar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ideajar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      POSTGRES_USER: ideajar
      POSTGRES_PASSWORD: ideajar
      POSTGRES_HOST: localhost
      POSTGRES_DB: ideajar_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Erlang/Elixir from .tool-versions
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Static analysis (Credo)
        run: mix credo

      - name: Audit dependencies for known vulnerabilities
        run: mix deps.audit

      - name: Setup test database (Postgres)
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Test
        run: mix test
