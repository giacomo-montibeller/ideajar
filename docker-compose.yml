services:
  postgres:
    image: postgres:16-alpine
    container_name: ideajar-postgres
    environment:
      POSTGRES_USER: ideajar
      POSTGRES_PASSWORD: ideajar
      POSTGRES_DB: ideajar_dev
    ports:
      - "5432:5432"
    volumes:
      - ideajar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideajar -d ideajar_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ideajar_postgres_data:
